name: baby-backend

x-database-url: &database-url ${DATABASE_DOCKER_URL:?Set DATABASE_DOCKER_URL in baby-backend/.env; start baby-database first}

# Settings both the API and the worker read (validated by src/config/environment.ts).
# Empty values disable the related feature; see .env.example for each variable.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: *database-url
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  ERROR_REPORTING_DSN: ${ERROR_REPORTING_DSN:-}
  AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
  AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-baby-family}
  AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-baby-family-app}
  AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY:-}
  AUTH_SECRET_PEPPER: ${AUTH_SECRET_PEPPER:-}
  COUPLE_CHECKIN_ENCRYPTION_KEY: ${COUPLE_CHECKIN_ENCRYPTION_KEY:-}
  SUPPORT_ENCRYPTION_KEY: ${SUPPORT_ENCRYPTION_KEY:-}
  IAP_PAYLOAD_ENCRYPTION_KEY: ${IAP_PAYLOAD_ENCRYPTION_KEY:-}
  IAP_ENVIRONMENT: ${IAP_ENVIRONMENT:-SANDBOX}
  APP_STORE_BUNDLE_ID: ${APP_STORE_BUNDLE_ID:-}
  APP_STORE_ROOT_CERTIFICATES_JSON: ${APP_STORE_ROOT_CERTIFICATES_JSON:-}
  PLAY_PACKAGE_NAME: ${PLAY_PACKAGE_NAME:-}
  PLAY_WEBHOOK_TOKEN: ${PLAY_WEBHOOK_TOKEN:-}
  # Supporting services from ../baby-storage (optional; empty disables the adapter).
  REDIS_URL: ${REDIS_DOCKER_URL:-}
  S3_ENDPOINT: ${S3_DOCKER_ENDPOINT:-http://baby-minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: 'true'
  S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-bf-media}
  S3_BUCKET_USER_MEDIA: ${S3_BUCKET_USER_MEDIA:-bf-user-media}
  S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-bf-exports}
  S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-bf-public}
  MEDIA_SERVER_PROCESSING: ${MEDIA_SERVER_PROCESSING:-disabled}
  SMTP_HOST: ${SMTP_DOCKER_HOST:-baby-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
  # Mailpit has no TLS; only the local .env sets this. Real SMTP must keep it false.
  SMTP_ALLOW_INSECURE: ${SMTP_ALLOW_INSECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-Baby Family <no-reply@babyfamily.local>}
  MAIL_HOST: ${MAIL_HOST:-}
  FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
  FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
  FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
  # AI 1.2 (BF-20261028-010): key chỉ đặt trong .env / secret store.
  AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-openrouter/free}
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}

services:
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    networks:
      - database
    restart: 'no'
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      AUTH_OTP_DELIVERY: ${AUTH_OTP_DELIVERY:-disabled}
      AUTH_OTP_MAIL_TO: ${AUTH_OTP_MAIL_TO:-otp-inbox@babyfamily.local}
      AUTH_OTP_ALLOW_MAIL_IN_PRODUCTION: ${AUTH_OTP_ALLOW_MAIL_IN_PRODUCTION:-false}
      AUTH_OTP_ALLOWED_COUNTRY_CODES: ${AUTH_OTP_ALLOWED_COUNTRY_CODES:-84}
      AUTH_APPLE_JWKS_URL: ${AUTH_APPLE_JWKS_URL:-}
      AUTH_APPLE_ISSUER: ${AUTH_APPLE_ISSUER:-}
      AUTH_APPLE_CLIENT_ID: ${AUTH_APPLE_CLIENT_ID:-}
      AUTH_GOOGLE_JWKS_URL: ${AUTH_GOOGLE_JWKS_URL:-}
      AUTH_GOOGLE_ISSUER: ${AUTH_GOOGLE_ISSUER:-}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      INVITE_LINK_BASE_URL: ${INVITE_LINK_BASE_URL:-https://babyfamily.vn/i/}
      ADMIN_CMS_TOTP_ENCRYPTION_KEY: ${ADMIN_CMS_TOTP_ENCRYPTION_KEY:-}
      ADMIN_CMS_TOKEN_SECRET: ${ADMIN_CMS_TOKEN_SECRET:-}
      SUPPORT_CONTACT_EMAIL: ${SUPPORT_CONTACT_EMAIL:-}
      SUPPORT_CONTACT_HOTLINE: ${SUPPORT_CONTACT_HOTLINE:-}
      LEGAL_TERMS_URL: ${LEGAL_TERMS_URL:-}
      LEGAL_PRIVACY_URL: ${LEGAL_PRIVACY_URL:-}
      LEGAL_LICENSES_URL: ${LEGAL_LICENSES_URL:-}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - storage
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

  # Background jobs: outbox relay, media processing, purge-orphans, reconcile-uploads.
  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *app-env
      WORKER_ID: ${WORKER_ID:-}
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-2}
      MEDIA_PURGE_UNATTACHED_AFTER_HOURS: ${MEDIA_PURGE_UNATTACHED_AFTER_HOURS:-}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - storage
    restart: unless-stopped
    init: true
    read_only: true
    # Media is processed in /tmp; size bounds the largest file the worker can handle.
    tmpfs:
      - /tmp:size=2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s

networks:
  database:
    name: ${DATABASE_NETWORK:-baby-family-data}
    external: true
  storage:
    name: ${STORAGE_NETWORK:-baby-family-storage}
    external: true
