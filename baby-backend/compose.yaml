name: baby-backend

x-database-url: &database-url ${DATABASE_DOCKER_URL:?Set DATABASE_DOCKER_URL in baby-backend/.env; start baby-database first}

services:
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    networks:
      - database
    restart: 'no'
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: *database-url
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - database
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

networks:
  database:
    name: ${DATABASE_NETWORK:-baby-family-data}
    external: true
