name: baby-database

# Also makes the backup destination available through Compose's env resolver.
x-backup-directory: ${POSTGRES_BACKUP_DIR:?Set POSTGRES_BACKUP_DIR in baby-database/.env}

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baby_family}
      POSTGRES_USER: ${POSTGRES_USER:-baby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in baby-database/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:?Set POSTGRES_DATA_DIR in baby-database/.env}
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    networks:
      data:
        aliases:
          - baby-postgres
    shm_size: 128mb
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  data:
    name: ${DATABASE_NETWORK:-baby-family-data}
