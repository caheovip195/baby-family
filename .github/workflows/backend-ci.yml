name: Backend CI

on:
  push:
    paths:
      - baby-backend/**
      - baby-database/**
      - baby-storage/**
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - baby-backend/**
      - baby-database/**
      - baby-storage/**
      - .github/workflows/backend-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: baby-backend

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://baby:baby_ci_only@127.0.0.1:5432/baby_family_test?schema=public
      DATABASE_DOCKER_URL: postgresql://baby:baby_ci_only@baby-postgres:5432/baby_family_test?schema=public
      HOST: 127.0.0.1
      PORT: 3000
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: silent
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: baby_family_test
          POSTGRES_USER: baby
          POSTGRES_PASSWORD: baby_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baby -d baby_family_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          cache: npm
          cache-dependency-path: baby-backend/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.20.0
      - name: Install dependencies and generate Prisma client
        run: npm ci
      - name: Validate Prisma schema
        run: npm run prisma:validate
      - name: Check model and repository generation
        run: npm run generate:persistence -- --check
      - name: Check internal service generation
        run: npm run generate:services -- --check
      - name: Check formatting
        run: |
          npm run format:check
          npm exec prettier -- --check ../.github/workflows/backend-ci.yml
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test the native compiled application
        run: npm run test:compiled
      - name: Unit tests
        run: npm test
      - name: HTTP tests
        run: npm run test:e2e
      - name: Apply migrations to the isolated test database
        run: npm run db:migrate:deploy
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose --project-directory ../baby-database --file ../baby-database/compose.yaml --env-file ../baby-database/.env.example config --quiet
          docker compose --project-directory ../baby-storage --file ../baby-storage/compose.yaml --env-file ../baby-storage/.env.example config --quiet
      - name: Build release and migration images
        run: docker compose build api migrate
