name: App CI

on:
  push:
    paths:
      - baby-family-app/**
      - .github/workflows/app-ci.yml
  pull_request:
    paths:
      - baby-family-app/**
      - .github/workflows/app-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: baby-family-app

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned project Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: baby-family-app/.fvmrc
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Generate models, API clients and routes
        run: dart run build_runner build
      - name: Check generated code and dependency lockfile
        run: git diff --exit-code -- .
      # Match Makefile's check targets without rewriting Dart sources in CI.
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
